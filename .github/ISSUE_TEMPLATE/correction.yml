name: 内容纠错
description: 反馈错别字、过期内容、链接失效、披露不足或推广规则问题
title: "[纠错] 简要描述问题"
labels: ["correction", "needs-review"]
body:
  - type: input
    id: page
    attributes:
      label: 页面或文件路径
      placeholder: 例如 docs/affiliate-program.md 或 docs/products/overview.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题说明
      placeholder: 请说明哪里不准确、过期或需要补充
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      placeholder: 可直接贴出建议文案
