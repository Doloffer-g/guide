    <text x="196" y="433" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Clear disclosure</text>
  </g>
  <g>
    <rect x="392" y="398" width="192" height="58" rx="8" fill="#F8FAFC" stroke="#C6CED8"/>
    <text x="418" y="433" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Verified claims</text>
  </g>
  <g>
    <rect x="614" y="398" width="192" height="58" rx="8" fill="#F8FAFC" stroke="#C6CED8"/>
    <text x="640" y="433" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Order attribution</text>
